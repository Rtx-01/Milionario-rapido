<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Curso Milionário</title>

<style>

body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    color:white;
    height:100vh;

   background:
linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
url("fundo.jpg") center/cover no-repeat fixed;

}

/* camada escura profissional */
.overlay{
    background:rgba(0,0,0,0.65);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

/* caixa principal */
.box{
    animation: aparecer 1.2s ease;
}

/* título */
h1{
    font-size:48px;
    margin-bottom:15px;
}

/* subtitulo */
p{
    font-size:20px;
    opacity:0.9;
}

/* botão */
.btn{
    margin-top:30px;
    display:inline-block;
    padding:18px 35px;
    background:linear-gradient(45deg,#00c6ff,#0072ff);
    color:white;
    text-decoration:none;
    border-radius:40px;
    font-size:18px;
    font-weight:bold;
    transition:0.3s;
    box-shadow:0 0 20px rgba(0,114,255,0.6);
}

/* efeito hover */
.btn:hover{
    transform:scale(1.08);
    box-shadow:0 0 35px rgba(0,114,255,1);
}

/* animação */
@keyframes aparecer{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* celular */
@media(max-width:700px){
    h1{
        font-size:32px;
    }
    p{
        font-size:16px;
    }
}

</style>
</head>

<body>

<div class="overlay">
<div class="box">

<h1>🔱 Curso Milionário 🔱</h1>

<p>
Aprenda estratégias reais para gerar renda on-line começando do zero<br>
</p>

href="https://wa.me/5573988138693?text=Olá!%20Quero%20saber%20sobre%20o%20Curso%20Milionário
"
target="_blank">
💬  fale comigo aqui
</a>

</div>
</div>

</body>
</html>
